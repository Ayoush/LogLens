minimum_pre_commit_version: "3.6.0"
fail_fast: false
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        # args replace the hook default, so --write stays explicit.
        args: ["-i", "4", "-ci", "-bn", "--write"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: branch-name
        name: branch name matches epic, task, or mentor/<slug>
        entry: bash tools/hooks/check.sh branch
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: conventional-commit
        name: conventional commit subject
        entry: bash tools/hooks/check.sh message
        language: system
        stages: [commit-msg]
